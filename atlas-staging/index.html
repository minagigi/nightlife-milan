<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>ATLAS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at 50% 40%, #10263d 0%, #071827 70%);
      color: #EAF6FF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    .globe { font-size: 64px; }
    h1 {
      font-size: 56px;
      font-weight: 800;
      letter-spacing: 14px;
      margin: 16px 0 8px;
      text-indent: 14px;
    }
    p { color: #7DA6C5; font-size: 15px; letter-spacing: 2px; text-transform: uppercase; }
  </style>
</head>
<body>
  <main>
    <div class="globe">🌐</div>
    <h1>ATLAS</h1>
    <p>International Commerce Toolkit</p>
  </main>
</body>
</html>
